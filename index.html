<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Spider-Man Web Shooter - 3D Model</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 14px; text-align: center;
      background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px;
      pointer-events: none;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 18px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading">Loading 3D model...</div>
  <div id="info">🖱 Drag to rotate • Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(80, 60, 120);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 5, 20);
    controls.update();

    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
    fillLight.position.set(-50, 0, -50);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
    rimLight.position.set(0, -50, 100);
    scene.add(rimLight);

    const loader = new STLLoader();
    loader.load('shooter.stl', function (geometry) {
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({
        color: 0xc41e3a, metalness: 0.7, roughness: 0.3,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(0, 5, 20);
      mesh.rotateX(-0.3);
      mesh.rotateY(0.5);
      scene.add(mesh);

      const wireframe = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: 0xffaa33, wireframe: true, transparent: true, opacity: 0.1,
      }));
      wireframe.position.copy(mesh.position);
      wireframe.rotation.copy(mesh.rotation);
      scene.add(wireframe);

      document.getElementById('loading').style.display = 'none';
    });

    const grid = new THREE.GridHelper(200, 20, 0x444466, 0x333355);
    grid.position.y = 0;
    scene.add(grid);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
